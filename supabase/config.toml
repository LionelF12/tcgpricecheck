# Supabase CLI configuration for TCG Price Check
# Project ref: cncpwvkxwgixqnhssols
# Dashboard: https://supabase.com/dashboard/project/cncpwvkxwgixqnhssols

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "tcgpricecheck://auth/callback"
additional_redirect_urls = ["tcgpricecheck://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
